<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070A12">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="AR Reverse Proxy — route domains to internal services with automatic nginx config and SSL.">
    <title>{% block title %}AR Reverse Proxy{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg?v={{ version|default('1') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v={{ version|default('static') }}">
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Toast stack -->
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    {% block scripts %}{% endblock %}
</body>
</html>
