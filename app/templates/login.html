{% extends "base.html" %}
{% block title %}Login · AR Reverse Proxy{% endblock %}

{% block content %}
<main class="min-h-screen flex items-center justify-center px-6 relative overflow-hidden">
    <!-- ambient grid -->
    <div class="absolute inset-0 opacity-[0.04] pointer-events-none"
         style="background-image: linear-gradient(#7dd3fc 1px, transparent 1px), linear-gradient(90deg, #7dd3fc 1px, transparent 1px); background-size: 48px 48px;"></div>

    <!-- glow -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[600px] h-[600px] rounded-full bg-cyan-500/10 blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md relative">
        <div class="mb-10 text-center">
            <div class="inline-flex items-center gap-2 text-xs uppercase tracking-[0.3em] text-cyan-400/80 mb-6">
                <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
                ar-reverse-proxy
            </div>
            <h1 class="text-5xl text-slate-100" style="font-family: 'Instrument Serif', serif;">
                Sign in to <em class="text-cyan-300">continue</em>
            </h1>
            <p class="mt-3 text-sm text-slate-500">Reverse proxy control plane</p>
        </div>

        <form method="post" action="/login"
              class="border border-slate-800 bg-slate-900/40 backdrop-blur-sm p-8 space-y-5">
            {% if error %}
            <div class="border border-red-500/40 bg-red-500/10 text-red-300 px-4 py-3 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <div>
                <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Username</label>
                <input type="text" name="username" required autofocus
                       class="w-full bg-black/40 border border-slate-800 focus:border-cyan-500/60 focus:outline-none px-4 py-3 text-slate-100 transition-colors">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-black/40 border border-slate-800 focus:border-cyan-500/60 focus:outline-none px-4 py-3 text-slate-100 transition-colors">
            </div>

            <button type="submit"
                    class="w-full bg-cyan-400 hover:bg-cyan-300 text-black font-bold py-3 transition-colors uppercase tracking-widest text-sm">
                Authenticate →
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-slate-600">
            Default credentials must be changed on first login.
        </p>
    </div>
</main>
{% endblock %}
