{#
  AR Reverse Proxy mark — three routing lanes converging on a single node.
  The top lane is lit: one active route through the proxy.
#}
{% macro mark(size=36) %}
<svg viewBox="0 0 48 48" width="{{ size }}" height="{{ size }}" style="flex-shrink:0"
     role="img" aria-label="AR Reverse Proxy">
  <defs>
    <linearGradient id="arp-tile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="arp-edge" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#38BDF8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#arp-tile)"/>
  <rect x="1" y="1" width="46" height="46" rx="13" fill="none" stroke="url(#arp-edge)" stroke-width="1.5"/>
  <!-- lanes in -->
  <path d="M11 15h9c3 0 4 3 7 3h1" fill="none" stroke="#38BDF8" stroke-width="2.4"
        stroke-linecap="round" opacity=".95"/>
  <path d="M11 24h17"              fill="none" stroke="#38BDF8" stroke-width="2.4"
        stroke-linecap="round" opacity=".45"/>
  <path d="M11 33h9c3 0 4-3 7-3h1" fill="none" stroke="#38BDF8" stroke-width="2.4"
        stroke-linecap="round" opacity=".28"/>
  <!-- the node everything routes through -->
  <circle cx="33" cy="24" r="5.5" fill="#0B0F1A" stroke="#7DD3FC" stroke-width="2.2"/>
  <circle cx="33" cy="24" r="1.8" fill="#7DD3FC"/>
</svg>
{% endmacro %}

{% macro wordmark(sub='Reverse Proxy') %}
<div style="min-width:0;line-height:1">
  <div class="brand-name">AR<span>PROXY</span></div>
  {% if sub %}<div class="brand-sub">{{ sub }}</div>{% endif %}
</div>
{% endmacro %}
